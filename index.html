<html>
<head>
  <meta charset="utf-8">
  <title>Espacio 3 - Piñata y Triángulos Azules</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>
  <a-scene>
    <!-- Fondo verde menta y base café pastel -->
    <a-sky color="#C8EFE2"></a-sky>
    <a-plane position="0 0 -4" rotation="-90 0 0" width="12" height="12" color="#E6D5C3"></a-plane>

    <!-- Modelado propio: piñata -->
    <a-entity gltf-model="piñata.glb" position="0 1.2 -4" rotation="0 0 0" scale="1 1 1"></a-entity>

    <!-- Triángulos azules alrededor de la piñata (cilindros de 3 lados) -->
    <a-cylinder position="-2.3 1.5 -4.2" radius="0.45" height="0.12" segments-radial="3" rotation="0 20 90" color="#4A90E2"></a-cylinder>
    <a-cylinder position="-1.4 2.4 -4.6" radius="0.38" height="0.12" segments-radial="3" rotation="15 -25 90" color="#5CA4E8"></a-cylinder>
    <a-cylinder position="-2.6 0.65 -3.5" radius="0.32" height="0.12" segments-radial="3" rotation="-10 30 90" color="#357ABD"></a-cylinder>

    <a-cylinder position="2.3 1.5 -4.2" radius="0.45" height="0.12" segments-radial="3" rotation="0 -20 90" color="#357ABD"></a-cylinder>
    <a-cylinder position="1.4 2.4 -4.6" radius="0.38" height="0.12" segments-radial="3" rotation="-15 25 90" color="#4A90E2"></a-cylinder>
    <a-cylinder position="2.6 0.65 -3.5" radius="0.32" height="0.12" segments-radial="3" rotation="10 -30 90" color="#5CA4E8"></a-cylinder>
  </a-scene>
</body>
</html>
